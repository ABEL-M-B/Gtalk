<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTalks</title>
    <link rel="stylesheet" href="../src/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="userAvatar">
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Communities">
                        <i class="fas fa-users"></i>
                    </button>
                    <button class="icon-btn" title="Status">
                        <i class="fas fa-circle-notch"></i>
                    </button>
                    <button class="icon-btn" title="Channels">
                        <i class="fas fa-broadcast-tower"></i>
                    </button>
                    <button class="icon-btn" title="New Chat">
                        <i class="fas fa-message"></i>
                    </button>
                    <button class="icon-btn" title="Menu" id="menuBtn">
                        <i class="fas fa-ellipsis-vertical"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" placeholder="Search or start new chat" class="search-input">
                </div>
                <button class="filter-btn">
                    <i class="fas fa-bars-filter"></i>
                </button>
            </div>

            <!-- Chat Tabs -->
            <div class="chat-tabs">
                <button class="tab-btn active">All</button>
                <button class="tab-btn">Unread</button>
                <button class="tab-btn">Favorites</button>
                <button class="tab-btn">Groups</button>
            </div>

            <!-- Chat List -->
            <div class="chat-list" id="chatList">
                <!-- Chats will be dynamically loaded here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Empty State (shown when no chat is selected) -->
            <div class="empty-state" id="emptyState">
                <div class="logo-icon large">
                    <i class="fas fa-comments"></i>
                </div>
                <h2>GTalks Web</h2>
                <p>Send and receive messages with friends and family. Start a conversation by selecting a chat or creating a new one.</p>
            </div>

            <!-- Chat Content (hidden by default) -->
            <div class="chat-content hidden" id="chatContent">
                <!-- Chat Header -->
                <div class="chat-area-header">
                    <div class="chat-contact-info">
                        <img src="https://via.placeholder.com/40" alt="Contact" class="contact-avatar" id="contactAvatar">
                        <div class="contact-details">
                            <h3 class="contact-name" id="contactName">Select a chat</h3>
                            <p class="contact-status" id="contactStatus">-</p>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="icon-btn" title="Video Call" id="videoCallBtn">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="icon-btn" title="Voice Call" id="voiceCallBtn">
                            <i class="fas fa-phone"></i>
                        </button>
                        <button class="icon-btn" title="Search">
                            <i class="fas fa-search"></i>
                        </button>
                        <button class="icon-btn" title="Menu">
                            <i class="fas fa-ellipsis-vertical"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messagesContainer">
                    <div class="messages-wrapper" id="messagesWrapper">
                        <!-- Messages will be dynamically loaded here -->
                    </div>
                </div>

                <!-- Message Input Area -->
                <div class="message-input-area">
                    <button class="icon-btn emoji-btn" title="Emoji">
                        <i class="fas fa-face-smile"></i>
                    </button>
                    <div class="attach-container">
                        <button class="icon-btn attach-btn" title="Attach" id="attachBtn">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <!-- Upward Dropdown Menu -->
                        <div class="attach-dropdown hidden" id="attachDropdown">
                            <div class="attach-dropdown-item" id="imageUploadBtn">
                                <i class="fas fa-image"></i>
                                <span>Photos</span>
                            </div>
                            <div class="attach-dropdown-item" id="docUploadBtn">
                                <i class="fas fa-file"></i>
                                <span>Document</span>
                            </div>
                            <div class="attach-dropdown-item">
                                <i class="fas fa-camera"></i>
                                <span>Camera</span>
                            </div>
                            <div class="attach-dropdown-item">
                                <i class="fas fa-user"></i>
                                <span>Contact</span>
                            </div>
                        </div>
                        <input type="file" accept="image/*" id="imageInput" style="display:none">
                        <input type="file" id="fileTransferInput" style="display:none">
                    </div>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Type a message" class="message-input" id="messageInput">
                    </div>
                    <button class="icon-btn send-btn hidden" title="Send" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                    <button class="icon-btn mic-btn" title="Voice Message" id="micBtn">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel (Contact Info) -->
        <div class="contact-panel hidden" id="contactPanel">
            <div class="panel-header">
                <button class="icon-btn close-panel" id="closePanel">
                    <i class="fas fa-xmark"></i>
                </button>
                <h3>Contact Info</h3>
            </div>
            <div class="panel-content">
                <div class="panel-profile">
                    <img src="https://via.placeholder.com/200" alt="Profile" class="panel-avatar" id="panelAvatar">
                    <h2 class="panel-name" id="panelName">-</h2>
                    <p class="panel-phone" id="panelPhone">-</p>
                </div>
                <div class="panel-section">
                    <h4>About</h4>
                    <p id="panelAbout">Available</p>
                </div>
                <div class="panel-section">
                    <h4>Media, Links and Docs</h4>
                    <div class="media-preview" id="mediaPreview">
                        <!-- Media will be dynamically loaded here -->
                    </div>
                </div>
                <div class="panel-actions">
                    <button class="action-btn">
                        <i class="fas fa-star"></i>
                        <span>Starred Messages</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-bell"></i>
                        <span>Mute Notifications</span>
                    </button>
                    <button class="action-btn danger">
                        <i class="fas fa-ban"></i>
                        <span>Block</span>
                    </button>
                    <button class="action-btn danger">
                        <i class="fas fa-thumbs-down"></i>
                        <span>Report</span>
                    </button>
                    <button class="action-btn danger" id="deleteChatBtn">
                        <i class="fas fa-trash"></i>
                        <span>Delete Chat</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div class="lightbox hidden" id="imageLightbox">
        <div class="lightbox-overlay"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">
                <i class="fas fa-xmark"></i>
            </button>
            <img src="" alt="Full Image" class="lightbox-image" id="lightboxImage">
        </div>
    </div>

    <!-- Dropdown Menu -->
    <div class="dropdown-menu hidden" id="dropdownMenu">
        <div class="dropdown-item" id="newGroupBtn">
            <i class="fas fa-users"></i>
            <span>New group</span>
        </div>
        <div class="dropdown-item" id="settingsBtn">
            <i class="fas fa-gear"></i>
            <span>Settings</span>
        </div>
        <div class="dropdown-item" id="logoutBtn">
            <i class="fas fa-right-from-bracket"></i>
            <span>Log out</span>
        </div>
    </div>

    <!-- Floating Call Window -->
    <div class="call-floating-window hidden" id="callFloatingWindow">
        <div class="call-header" id="callHeader">
            <span id="callStatus">Calling...</span>
            <button id="endCallBtn" class="icon-btn" title="End Call">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <!-- File Transfers Panel -->
    <div class="ft-panel hidden" id="ftPanel">
        <div class="ft-panel-header">
            <span><i class="fas fa-exchange-alt"></i> File Transfers</span>
            <button class="icon-btn" id="ftPanelClose"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="ft-panel-body" id="ftPanelBody"></div>
    </div>

    <script src = "/socket.io/socket.io.js"></script>
    <script>
        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', function() {
            window.location.href = '/api/auth/logout';
        });

        const dropdownMenu = document.getElementById('dropdownMenu');
        const menuBtn = document.getElementById('menuBtn');

        // Helper to position dropdown below menuBtn (fixed positioning)
        function positionDropdownMenu() {
            const btnRect = menuBtn.getBoundingClientRect();
            dropdownMenu.style.position = 'fixed';
            dropdownMenu.style.top = (btnRect.bottom + 8) + 'px';
            dropdownMenu.style.left = (btnRect.left) + 'px';
            dropdownMenu.style.right = '';
        }

        // Menu toggle
        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            positionDropdownMenu();
            dropdownMenu.classList.toggle('hidden');
        });

        // Prevent closing when clicking inside the dropdown
        dropdownMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // Close menu when clicking outside
        document.addEventListener('click', function() {
            dropdownMenu.classList.add('hidden');
        });



        const chatList = document.getElementById('chatList');
        const searchInput = document.querySelector('.search-input');

        // Render users in chat-list
        function renderUsers(users) {
            chatList.innerHTML = '';
            if (!users.length) {
                chatList.innerHTML = '<div class="chat-item"><span>No users found.</span></div>';
                return;
            }
            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                const avatarUrl = user.avatar ? '/api/proxy/avatar?url=' + encodeURIComponent(user.avatar) : 'https://dummyimage.com/49x49/cccccc/000000&text=Avatar';
                item.innerHTML = `
                    <img src="${avatarUrl}" class="chat-avatar" alt="${user.name}" loading="lazy" onerror="this.src='https://dummyimage.com/49x49/cccccc/000000&text=Avatar'">
                    <div class="chat-info">
                        <div class="chat-header">
                            <span class="chat-name">${user.name}</span>
                        </div>
                        <div class="chat-preview">
                            <span class="last-message">${user.about || ''}</span>
                        </div>
                    </div>
                `;
                // Use _id consistently for all operations
                item.addEventListener('click', () => showChatWithUser(user));
                chatList.appendChild(item);
            });
        }

        // Fetch all users
        function fetchAllUsers() {
            fetch('/api/users')
                .then(res => res.json())
                .then(data => renderUsers(data.users || []))
                .catch(() => renderUsers([]));
        }

        // Search users
        function searchUsers(query) {
            fetch('/api/users/search?q=' + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => renderUsers(data.users || []))
                .catch(() => renderUsers([]));
        }

        // Initial load
        fetchAllUsers();

        // Search input handler
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query) {
                searchUsers(query);
            } else {
                fetchAllUsers();
            }
        });


        
        
        

        //chat scripts
        const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true
        })

        let currentUserId = null;
        let currentUserName = null;
        let selectedUser = null;
        fetch('/api/auth/user')
            .then(res => res.json())
            .then(data => {
                 currentUserId = data._id;
                 currentUserName = data.name || data.displayName || 'Me';
                 // Set user avatar
                 const userAvatar = document.getElementById('userAvatar');
                 if (data.avatar) {
                     userAvatar.src = '/api/proxy/avatar?url=' + encodeURIComponent(data.avatar);
                 }
                 userAvatar.onerror = function() {
                     this.src = 'https://dummyimage.com/40x40/cccccc/000000&text=Avatar';
                 };
                socket.emit('register',currentUserId);
            });

        // Handle socket reconnection
        socket.on('reconnect', () => {
            console.log('Socket reconnected, re-registering user');
            if (currentUserId) {
                socket.emit('register', currentUserId);
            }
        });

        socket.on('disconnect', (reason) => {
            console.log('Socket disconnected:', reason);
        });

        function showChatWithUser(user) {
            selectedUser = user
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('chatContent').classList.remove('hidden');
            document.getElementById('contactName').textContent = user.name;
            const contactAvatarUrl = user.avatar ? '/api/proxy/avatar?url=' + encodeURIComponent(user.avatar) : 'https://dummyimage.com/40x40/cccccc/000000&text=Avatar';
            document.getElementById('contactAvatar').src = contactAvatarUrl;
            document.getElementById('contactAvatar').onerror = function() {
                this.src = 'https://dummyimage.com/40x40/cccccc/000000&text=Avatar';
            };
            document.getElementById('contactStatus').textContent = user.status || '';
            fetchMessagesWithUser(user);
        }

        // Helper to render messages
        function renderMessages(messages) {
            const wrapper = document.getElementById('messagesWrapper');
            const container = document.getElementById('messagesContainer');
            wrapper.innerHTML = '';
            
            messages.forEach(msg => {
                const div = document.createElement('div');
                // Sent/received styling
                const isSent = String(msg.from) === String(currentUserId);
                div.className = `message ${isSent ? 'sent' : 'received'}`;

                // Check if it's an image message
                if (msg.url) {
                    div.innerHTML = `
                        <div class="message-content message-image">
                            <div style="width: 300px; height: 200px; background: #374045; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-image" style="font-size: 2rem; color: #8696a0;"></i>
                            </div>
                            <span class="message-time">
                                ${new Date(msg.timestamp).toLocaleTimeString([], {
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}
                            </span>
                        </div>
                    `;
                    
                    wrapper.appendChild(div);
                    
                    // Load actual image
                    const img = new Image();
                    img.src = msg.url;
                    img.className = 'shared-image';
                    img.setAttribute('data-fullsize', msg.url);
                    img.onload = function() {
                        // Replace placeholder with actual image
                        const placeholder = div.querySelector('.message-content > div');
                        if (placeholder) {
                            placeholder.replaceWith(img);
                        }
                    };
                    img.addEventListener('click', function() {
                        openLightbox(this.dataset.fullsize);
                    });
                } else {
                    div.innerHTML = `
                        <div class="message-content">
                            <p>${msg.text}</p>
                            <span class="message-time">
                                ${new Date(msg.timestamp).toLocaleTimeString([], {
                                    hour: '2-digit',
                                    minute: '2-digit'
                                })}
                            </span>
                        </div>
                    `;
                    wrapper.appendChild(div);
                }
            });
            
            // Scroll to bottom immediately since placeholders are already sized
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        // Helper to add message to UI
        function addMessageToUI(msg, isImage) {
            const div = document.createElement('div');
            const isSent = String(msg.from) === String(currentUserId);
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            
            if (isImage) {
                div.innerHTML = `
                    <div class="message-content message-image">
                        <img src="${msg.url}" alt="Image" class="shared-image" data-fullsize="${msg.url}">
                        <span class="message-time">
                            ${new Date(msg.timestamp).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit'
                            })}
                        </span>
                    </div>
                `;
                div.querySelector('.shared-image').addEventListener('click', function() {
                    openLightbox(this.dataset.fullsize);
                });
            } else {
                div.innerHTML = `
                    <div class="message-content">
                        <p>${msg.text}</p>
                        <span class="message-time">
                            ${new Date(msg.timestamp).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit'
                            })}
                        </span>
                    </div>
                `;
            }
            
            document.getElementById('messagesWrapper').appendChild(div);
            document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
        }

        // Listen for incoming text messages
        socket.on('receiveMessage', (msg) => {
            // Show message if chatting with the sender OR if you sent it
            if (selectedUser && (msg.from === selectedUser._id || msg.to === selectedUser._id || 
                (msg.from === currentUserId && msg.to === selectedUser._id))) {
                addMessageToUI(msg, false);
            }
        });

        // Listen for incoming image messages
        socket.on('receiveImage', (msg) => {
            // Show image if chatting with the sender OR if you sent it
            if (selectedUser && (msg.from === selectedUser._id || msg.to === selectedUser._id ||
                (msg.from === currentUserId && msg.to === selectedUser._id))) {
                addMessageToUI(msg, true);
            }
        });

        // Fetch messages for selected user
        async function fetchMessagesWithUser(user) {
            try {
                const res = await fetch(`/api/messages?to=${encodeURIComponent(user._id)}`);
                const data = await res.json();
                renderMessages(data.messages || []);
            } catch (e) {
                renderMessages([]);
            }
        }

        // Send message logic
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Show send icon only when input has text
        messageInput.addEventListener('input', function() {
            if (this.value.trim()) {
                sendBtn.classList.remove('hidden');
            } else {
                sendBtn.classList.add('hidden');
            }
        });

        // Send message on click
        sendBtn.addEventListener('click', async function() {
            const text = messageInput.value.trim();
            if (!text || !selectedUser) return;
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({to: selectedUser._id, text})
                });
                if (res.ok) {
                    // Emit via socket for real-time delivery
                    socket.emit('sendMessage', {
                        from: currentUserId,
                        to: selectedUser._id,
                        text
                    });
                    
                    messageInput.value = '';
                    sendBtn.classList.add('hidden');
                    // Message will be added via socket 'receiveMessage' event
                }
            } finally {
                sendBtn.disabled = false;
            }
        });

        // Optionally, send message on Enter key
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey && !sendBtn.classList.contains('hidden')) {
                sendBtn.click();
                e.preventDefault();
            }
        });

        // Lightbox logic
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxOverlay = document.querySelector('.lightbox-overlay');

        function openLightbox(imageUrl) {
            lightboxImage.src = imageUrl;
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.add('hidden');
            lightboxImage.src = '';
            document.body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxOverlay.addEventListener('click', closeLightbox);

        // Close lightbox on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });

        // Attach dropdown logic
        const attachBtn = document.getElementById('attachBtn');
        const attachDropdown = document.getElementById('attachDropdown');
        const imageUploadBtn = document.getElementById('imageUploadBtn');
        const imageInput = document.getElementById('imageInput');

        attachBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            attachDropdown.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!attachDropdown.contains(e.target) && e.target !== attachBtn) {
                attachDropdown.classList.add('hidden');
            }
        });

        // Open file picker for images
        imageUploadBtn.addEventListener('click', function() {
            imageInput.click();
            attachDropdown.classList.add('hidden');
        });

        // Handle image upload
        imageInput.addEventListener('change', async function() {
            if (!this.files.length || !selectedUser) return;
            const file = this.files[0];
            const formData = new FormData();
            formData.append('image', file);
            formData.append('to', selectedUser._id);

            try {
                const res = await fetch('/api/images/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    
                    // Emit via socket for real-time delivery
                    socket.emit('sendImage', {
                        from: currentUserId,
                        to: selectedUser._id,
                        url: data.imageMessage.url,
                        public_id: data.imageMessage.public_id
                    });
                    // Image will be added via socket 'receiveImage' event
                } else {
                    alert('Image upload failed');
                }
            } catch (err) {
                alert('Image upload error');
            } finally {
                imageInput.value = '';
            }
        });

        // WebRTC and Call functionality
        let localStream = null;
        let peerConnection = null;
        let isCallActive = false;
        let iceCandidateQueue = []; // Queue for ICE candidates that arrive early
        const configuration = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const callFloatingWindow = document.getElementById('callFloatingWindow');
        const callHeader = document.getElementById('callHeader');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const endCallBtn = document.getElementById('endCallBtn');
        const remoteAudio = document.getElementById('remoteAudio');
        let isDragging = false, offsetX = 0, offsetY = 0;

        // Draggable functionality
        callHeader.addEventListener('mousedown', function(e) {
            isDragging = true;
            offsetX = e.clientX - callFloatingWindow.offsetLeft;
            offsetY = e.clientY - callFloatingWindow.offsetTop;
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                callFloatingWindow.style.left = (e.clientX - offsetX) + 'px';
                callFloatingWindow.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });

        function showCallWindow(statusText) {
            document.getElementById('callStatus').textContent = statusText || 'Calling...';
            callFloatingWindow.classList.remove('hidden');
        }

        function hideCallWindow() {
            callFloatingWindow.classList.add('hidden');
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            isCallActive = false;
            iceCandidateQueue = []; // Clear the queue
        }

        // Voice call button handler
        voiceCallBtn.addEventListener('click', async function() {
            if (!selectedUser) {
                alert('Please select a user to call');
                return;
            }
            await initiateCall();
        });

        // End call button handler
        endCallBtn.addEventListener('click', function() {
            endCall();
        });

        // Initialize call
        async function initiateCall() {
            try {
                // Clean up any existing connection first
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                iceCandidateQueue = [];
                
                // Get user media
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                showCallWindow('Calling ' + selectedUser.name + '...');
                isCallActive = true;

                peerConnection = new RTCPeerConnection(configuration);
                
                // Add local stream to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Handle remote stream
                peerConnection.ontrack = function(event) {
                    remoteAudio.srcObject = event.streams[0];
                    showCallWindow('Connected');
                };

                // Handle ICE candidates
                peerConnection.onicecandidate = function(event) {
                    if (event.candidate) {
                        socket.emit('callUser', {
                            to: selectedUser._id,
                            from: currentUserId,
                            signalData: event.candidate
                        });
                    }
                };

                // Create offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // Send offer to recipient
                socket.emit('callUser', {
                    to: selectedUser._id,
                    from: currentUserId,
                    signalData: offer
                });

            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone');
                hideCallWindow();
            }
        }

        // Accept incoming call
        async function acceptCall(signalData) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                showCallWindow('Connecting...');
                isCallActive = true;

                peerConnection = new RTCPeerConnection(configuration);
                
                // Add local stream to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Handle remote stream
                peerConnection.ontrack = function(event) {
                    remoteAudio.srcObject = event.streams[0];
                    showCallWindow('Connected');
                };

                // Handle ICE candidates
                peerConnection.onicecandidate = function(event) {
                    if (event.candidate) {
                        socket.emit('acceptCall', {
                            to: selectedUser._id,
                            signalData: event.candidate
                        });
                    }
                };

                // Set remote description and create answer
                await peerConnection.setRemoteDescription(signalData);
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                // Send answer back
                socket.emit('acceptCall', {
                    to: selectedUser._id,
                    signalData: answer
                });

                // Process any queued ICE candidates
                while (iceCandidateQueue.length > 0) {
                    const candidate = iceCandidateQueue.shift();
                    await peerConnection.addIceCandidate(candidate);
                }

            } catch (error) {
                console.error('Error accepting call:', error);
                hideCallWindow();
            }
        }

        // End call
        function endCall() {
            if (selectedUser && isCallActive) {
                socket.emit('endCall', { to: selectedUser._id });
            }
            hideCallWindow();
        }

        // Socket listeners for call events
        socket.on('incomingCall', ({ from, signalData }) => {
            if (signalData.type === 'offer') {
                // Clear any old queued candidates from previous calls
                iceCandidateQueue = [];
                if (confirm('Incoming call. Accept?')) {
                    acceptCall(signalData);
                }
            } else if (signalData.candidate) {
                // Queue ICE candidate if peer connection not ready, otherwise add it
                if (peerConnection && peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(signalData).catch(err => {
                        console.error('Error adding ICE candidate:', err);
                    });
                } else {
                    iceCandidateQueue.push(signalData);
                }
            }
        });

        socket.on('callAccepted', async ({ signalData }) => {
            try {
                if (signalData.type === 'answer') {
                    await peerConnection.setRemoteDescription(signalData);
                    // Process any queued ICE candidates after setting remote description
                    while (iceCandidateQueue.length > 0) {
                        const candidate = iceCandidateQueue.shift();
                        await peerConnection.addIceCandidate(candidate);
                    }
                } else if (signalData.candidate) {
                    // Queue ICE candidate if remote description not set yet, otherwise add it
                    if (peerConnection && peerConnection.remoteDescription) {
                        await peerConnection.addIceCandidate(signalData);
                    } else {
                        iceCandidateQueue.push(signalData);
                    }
                }
            } catch (error) {
                console.error('Error handling call accepted:', error);
            }
        });

        socket.on('callEnded', () => {
            hideCallWindow();
        });

        // =====================================================
        // FILE TRANSFER SYSTEM (P2P via WebRTC DataChannel)
        // =====================================================

        // -- Constants --
        const FT_CHUNK_SIZE = 64 * 1024;            // 64KB per chunk
        const FT_BUFFER_FULL = 256 * 1024;           // pause sending when buffer exceeds this
        const FT_ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
        const ftTransfers = {};                      // active transfers keyed by transferId

        // -- Utility: generate unique ID --
        function ftId() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
        }

        // -- Utility: format bytes --
        function ftFmt(b) {
            if (!b || b <= 0) return '0 B';
            const u = ['B','KB','MB','GB','TB'];
            const i = Math.floor(Math.log(b) / Math.log(1024));
            return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
        }

        // -- Utility: SHA-256 hash of ArrayBuffer, returns hex string --
        async function ftHash(buf) {
            const h = await crypto.subtle.digest('SHA-256', buf);
            return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('');
        }

        // ========== IndexedDB Helpers ==========
        // Open (or create) a database for a transfer
        function ftOpenDB(id) {
            return new Promise((ok, fail) => {
                const r = indexedDB.open('ft_' + id, 1);
                r.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks');
                    if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
                };
                r.onsuccess = () => ok(r.result);
                r.onerror = () => fail(r.error);
            });
        }
        // Put a value into a store
        function ftPut(db, store, key, val) {
            return new Promise((ok, fail) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).put(val, key);
                tx.oncomplete = ok;
                tx.onerror = () => fail(tx.error);
            });
        }
        // Get a value from a store
        function ftGet(db, store, key) {
            return new Promise((ok, fail) => {
                const tx = db.transaction(store, 'readonly');
                const r = tx.objectStore(store).get(key);
                r.onsuccess = () => ok(r.result);
                r.onerror = () => fail(r.error);
            });
        }
        // Get all keys from a store
        function ftKeys(db, store) {
            return new Promise((ok, fail) => {
                const tx = db.transaction(store, 'readonly');
                const r = tx.objectStore(store).getAllKeys();
                r.onsuccess = () => ok(r.result);
                r.onerror = () => fail(r.error);
            });
        }
        // Delete the entire database for a transfer
        function ftDelDB(id) { indexedDB.deleteDatabase('ft_' + id); }

        // ========== UI Helpers ==========
        // Show the floating transfers panel
        function ftShowPanel() {
            document.getElementById('ftPanel').classList.remove('hidden');
        }
        // Hide panel if empty
        function ftHidePanel() {
            if (!document.getElementById('ftPanelBody').children.length)
                document.getElementById('ftPanel').classList.add('hidden');
        }
        // Create a transfer progress card
        function ftCreateUI(t) {
            ftShowPanel();
            const el = document.createElement('div');
            el.className = 'ft-item';
            el.id = 'ft-' + t.id;
            const icon = t.role === 'sender' ? 'fa-arrow-up' : 'fa-arrow-down';
            const dir = t.role === 'sender' ? 'Sending to' : 'Receiving from';
            el.innerHTML = `
                <div class="ft-row">
                    <i class="fas ${icon} ft-icon"></i>
                    <div class="ft-details">
                        <div class="ft-filename">${t.fileName}</div>
                        <div class="ft-meta">${ftFmt(t.fileSize)} &middot; ${dir} ${t.peerName}</div>
                    </div>
                </div>
                <div class="ft-progress-track"><div class="ft-progress-fill" style="width:0%"></div></div>
                <div class="ft-row ft-stats">
                    <span class="ft-speed">Waiting...</span>
                    <span class="ft-percent">0%</span>
                </div>
                <div class="ft-row ft-actions">
                    <button class="ft-btn ft-pause" onclick="ftTogglePause('${t.id}')" title="Pause/Resume"><i class="fas fa-pause"></i></button>
                    <button class="ft-btn ft-cancel" onclick="ftCancelTransfer('${t.id}')" title="Cancel"><i class="fas fa-xmark"></i></button>
                </div>`;
            document.getElementById('ftPanelBody').appendChild(el);
        }
        // Update progress bar, speed, and percentage
        function ftUpdateUI(id, bytes, total, speed, status) {
            const el = document.getElementById('ft-' + id);
            if (!el) return;
            const pct = Math.min(100, Math.floor((bytes / total) * 100));
            const fill = el.querySelector('.ft-progress-fill');
            const sp = el.querySelector('.ft-speed');
            const pc = el.querySelector('.ft-percent');
            if (fill) fill.style.width = pct + '%';
            if (sp) sp.textContent = status || (ftFmt(speed) + '/s');
            if (pc) pc.textContent = pct + '%';
        }
        // Mark transfer complete, show download link (receiver) or dismiss (sender)
        function ftDoneUI(id, url, name) {
            const el = document.getElementById('ft-' + id);
            if (!el) return;
            el.querySelector('.ft-progress-fill').style.width = '100%';
            el.querySelector('.ft-speed').textContent = 'Complete';
            el.querySelector('.ft-percent').textContent = '100%';
            const acts = el.querySelector('.ft-actions');
            acts.innerHTML = (url ?
                `<a href="${url}" download="${name}" class="ft-btn ft-download" title="Download"><i class="fas fa-download"></i></a>` : '') +
                `<button class="ft-btn" onclick="ftDismiss('${id}')" title="Dismiss"><i class="fas fa-xmark"></i></button>`;
        }
        // Remove a transfer from the panel and clean up
        function ftDismiss(id) {
            const el = document.getElementById('ft-' + id);
            if (el) el.remove();
            ftHidePanel();
            ftDelDB(id);
            delete ftTransfers[id];
        }

        // ========== Speed Tracking ==========
        // Called after each chunk sent/received to compute transfer speed
        function ftTrackSpeed(t, chunkBytes) {
            t.bytes += chunkBytes;
            const now = Date.now();
            if (!t.speedT) { t.speedT = now; t.speedB = 0; return 0; }
            const dt = (now - t.speedT) / 1000;
            if (dt >= 0.5) {
                t.speed = (t.bytes - t.speedB) / dt;
                t.speedT = now;
                t.speedB = t.bytes;
            }
            return t.speed || 0;
        }

        // ===================== SENDER LOGIC =====================

        // User picks a file and initiates a P2P transfer
        async function ftSend(file) {
            if (!selectedUser) { alert('Select a user first'); return; }
            const id = ftId();
            const totalChunks = Math.ceil(file.size / FT_CHUNK_SIZE);

            // Create transfer state
            const t = {
                id, fileName: file.name, fileSize: file.size, totalChunks,
                role: 'sender', peerId: selectedUser._id, peerName: selectedUser.name,
                file, pc: null, dc: null, db: null,
                sent: new Set(), bytes: 0, paused: false, cancelled: false,
                speed: 0, speedT: null, speedB: 0, iceQueue: []
            };
            ftTransfers[id] = t;
            ftCreateUI(t);
            ftUpdateUI(id, 0, file.size, 0, 'Waiting for acceptance...');

            // Send file offer to receiver via signaling
            socket.emit('fileOffer', {
                to: selectedUser._id, from: currentUserId,
                senderName: currentUserName,
                transferId: id, fileName: file.name,
                fileSize: file.size, totalChunks
            });
        }

        // Receiver accepted → create RTCPeerConnection + DataChannel
        async function ftSenderConnect(t, alreadyHave) {
            // Mark chunks the receiver already has (for resume)
            t.sent = new Set(alreadyHave || []);
            t.bytes = t.sent.size * FT_CHUNK_SIZE;

            // Open IndexedDB to persist sender state
            t.db = await ftOpenDB(t.id);
            await ftPut(t.db, 'meta', 'info', {
                id: t.id, fileName: t.fileName, fileSize: t.fileSize,
                totalChunks: t.totalChunks, role: 'sender', peerId: t.peerId
            });

            // Create WebRTC peer connection
            t.pc = new RTCPeerConnection({ iceServers: FT_ICE });

            // Create the DataChannel for sending file chunks
            t.dc = t.pc.createDataChannel('ft', { ordered: true });
            t.dc.binaryType = 'arraybuffer';

            // When DataChannel opens, start sending chunks
            t.dc.onopen = () => {
                ftUpdateUI(t.id, t.bytes, t.fileSize, 0, 'Sending...');
                ftSendChunks(t);
            };
            t.dc.onclose = () => {
                if (!t.cancelled && t.sent.size < t.totalChunks)
                    ftUpdateUI(t.id, t.bytes, t.fileSize, 0, 'Disconnected');
            };

            // Relay ICE candidates to receiver
            t.pc.onicecandidate = e => {
                if (e.candidate) socket.emit('fileSignal', {
                    to: t.peerId, transferId: t.id,
                    signalData: { type: 'candidate', candidate: e.candidate }
                });
            };

            // Create WebRTC offer and send via signaling
            const offer = await t.pc.createOffer();
            await t.pc.setLocalDescription(offer);
            socket.emit('fileSignal', {
                to: t.peerId, transferId: t.id,
                signalData: { type: 'offer', sdp: offer }
            });
        }

        // Send chunks sequentially with rate-limiting via bufferedAmount
        async function ftSendChunks(t) {
            for (let i = 0; i < t.totalChunks; i++) {
                if (t.cancelled) return;
                if (t.sent.has(i)) continue; // skip already-received chunks (resume)

                // Pause loop — wait while paused
                while (t.paused && !t.cancelled) await new Promise(r => setTimeout(r, 200));
                if (t.cancelled) return;

                // Rate-limit: wait if DataChannel buffer is full
                while (t.dc.bufferedAmount > FT_BUFFER_FULL && !t.cancelled)
                    await new Promise(r => setTimeout(r, 30));
                if (t.cancelled) return;

                // Slice the chunk from the file
                const start = i * FT_CHUNK_SIZE;
                const end = Math.min(start + FT_CHUNK_SIZE, t.file.size);
                const buf = await t.file.slice(start, end).arrayBuffer();
                // Compute chunk hash for integrity
                const hash = await ftHash(buf);

                // Send JSON header then binary data (DataChannel is ordered)
                t.dc.send(JSON.stringify({ type: 'chunk', i, h: hash, s: buf.byteLength }));
                t.dc.send(buf);

                // Track progress
                t.sent.add(i);
                const spd = ftTrackSpeed(t, buf.byteLength);
                ftUpdateUI(t.id, t.bytes, t.fileSize, spd);

                // Persist progress to IndexedDB every 100 chunks
                if (i % 100 === 0) await ftPut(t.db, 'meta', 'sent', [...t.sent]);
            }

            // All chunks sent — notify receiver
            t.dc.send(JSON.stringify({ type: 'done' }));
            ftDoneUI(t.id, null, null);
            await ftPut(t.db, 'meta', 'status', 'completed');
        }

        // ===================== RECEIVER LOGIC =====================

        // Incoming file offer — prompt user to accept or reject
        function ftHandleOffer(data) {
            const { from, senderName, transferId, fileName, fileSize, totalChunks } = data;
            const name = senderName || from;

            if (!confirm(`${name} wants to send you:\n${fileName} (${ftFmt(fileSize)})\n\nAccept?`)) {
                socket.emit('fileReject', { to: from, transferId });
                return;
            }

            // Create receiver transfer state
            const t = {
                id: transferId, fileName, fileSize, totalChunks,
                role: 'receiver', peerId: from, peerName: name,
                pc: null, dc: null, db: null,
                received: new Set(), bytes: 0, paused: false, cancelled: false,
                speed: 0, speedT: null, speedB: 0, pending: null, iceQueue: []
            };
            ftTransfers[transferId] = t;
            ftCreateUI(t);
            ftReceiverConnect(t);
        }

        // Set up receiver WebRTC connection and send acceptance
        async function ftReceiverConnect(t) {
            t.db = await ftOpenDB(t.id);

            // Check for already-received chunks in IndexedDB (resume scenario)
            const keys = await ftKeys(t.db, 'chunks');
            t.received = new Set(keys.map(Number));
            t.bytes = t.received.size * FT_CHUNK_SIZE;

            // Persist receiver metadata
            await ftPut(t.db, 'meta', 'info', {
                id: t.id, fileName: t.fileName, fileSize: t.fileSize,
                totalChunks: t.totalChunks, role: 'receiver', peerId: t.peerId
            });

            // Tell sender we accepted, include already-received chunk list
            socket.emit('fileAccept', {
                to: t.peerId, transferId: t.id,
                receivedChunks: [...t.received]
            });

            // Create WebRTC peer connection
            t.pc = new RTCPeerConnection({ iceServers: FT_ICE });

            // Listen for DataChannel from sender
            t.pc.ondatachannel = e => {
                t.dc = e.channel;
                t.dc.binaryType = 'arraybuffer';
                ftSetupReceiverDC(t);
            };

            // Relay ICE candidates to sender
            t.pc.onicecandidate = e => {
                if (e.candidate) socket.emit('fileSignal', {
                    to: t.peerId, transferId: t.id,
                    signalData: { type: 'candidate', candidate: e.candidate }
                });
            };
        }

        // Wire up DataChannel event handlers on the receiver
        function ftSetupReceiverDC(t) {
            t.dc.onmessage = async e => {
                // JSON string = control message (chunk header or done)
                if (typeof e.data === 'string') {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'chunk') {
                        // Next binary message will be this chunk's data
                        t.pending = msg;
                    } else if (msg.type === 'done') {
                        // All chunks arrived — merge and offer download
                        await ftMerge(t);
                    }
                } else if (t.pending) {
                    // Binary message = chunk data (follows a chunk header)
                    const hdr = t.pending;
                    t.pending = null;
                    const buf = e.data;

                    // Validate chunk hash
                    const h = await ftHash(buf);
                    if (h !== hdr.h) {
                        console.warn('Chunk', hdr.i, 'hash mismatch — skipping');
                        return;
                    }

                    // Store valid chunk in IndexedDB
                    await ftPut(t.db, 'chunks', hdr.i, buf);
                    t.received.add(hdr.i);

                    // Update progress and speed
                    const spd = ftTrackSpeed(t, buf.byteLength);
                    ftUpdateUI(t.id, t.bytes, t.fileSize, spd);

                    // Persist progress every 100 chunks
                    if (t.received.size % 100 === 0)
                        await ftPut(t.db, 'meta', 'received', [...t.received]);
                }
            };
            t.dc.onclose = () => {
                if (!t.cancelled && t.received.size < t.totalChunks)
                    ftUpdateUI(t.id, t.bytes, t.fileSize, 0, 'Disconnected');
            };
            t.dc.onopen = () => {
                ftUpdateUI(t.id, t.bytes, t.fileSize, 0, 'Receiving...');
            };
        }

        // Merge all stored chunks into a Blob and trigger download
        async function ftMerge(t) {
            ftUpdateUI(t.id, t.fileSize, t.fileSize, 0, 'Merging file...');
            const parts = [];
            for (let i = 0; i < t.totalChunks; i++) {
                const chunk = await ftGet(t.db, 'chunks', i);
                if (!chunk) {
                    ftUpdateUI(t.id, t.bytes, t.fileSize, 0, 'Missing chunk ' + i);
                    return;
                }
                parts.push(chunk);
            }
            // Create Blob from chunks (memory efficient — no single giant buffer)
            const blob = new Blob(parts);
            const url = URL.createObjectURL(blob);
            await ftPut(t.db, 'meta', 'status', 'completed');
            ftDoneUI(t.id, url, t.fileName);
        }

        // ===================== SIGNALING =====================
        // Handle WebRTC offer/answer/ICE for file transfer connections
        async function ftHandleSignal(data) {
            const { from, transferId, signalData } = data;
            const t = ftTransfers[transferId];
            if (!t) return;
            try {
                if (signalData.type === 'offer') {
                    await t.pc.setRemoteDescription(signalData.sdp);
                    const answer = await t.pc.createAnswer();
                    await t.pc.setLocalDescription(answer);
                    socket.emit('fileSignal', {
                        to: from, transferId,
                        signalData: { type: 'answer', sdp: answer }
                    });
                    // Flush queued ICE candidates
                    for (const c of t.iceQueue) await t.pc.addIceCandidate(c);
                    t.iceQueue = [];
                } else if (signalData.type === 'answer') {
                    await t.pc.setRemoteDescription(signalData.sdp);
                    for (const c of t.iceQueue) await t.pc.addIceCandidate(c);
                    t.iceQueue = [];
                } else if (signalData.type === 'candidate') {
                    // Queue candidates until remote description is set
                    if (t.pc.remoteDescription) {
                        await t.pc.addIceCandidate(signalData.candidate);
                    } else {
                        t.iceQueue.push(signalData.candidate);
                    }
                }
            } catch (err) {
                console.error('File transfer signal error:', err);
            }
        }

        // ===================== PAUSE / CANCEL =====================
        // Toggle pause state for a transfer
        function ftTogglePause(id) {
            const t = ftTransfers[id];
            if (!t) return;
            t.paused = !t.paused;
            const btn = document.querySelector('#ft-' + id + ' .ft-pause i');
            if (btn) btn.className = t.paused ? 'fas fa-play' : 'fas fa-pause';
            ftUpdateUI(id, t.bytes, t.fileSize, t.speed,
                t.paused ? 'Paused' : (t.role === 'sender' ? 'Sending...' : 'Receiving...'));
        }

        // Cancel a transfer, close connections, clean up
        function ftCancelTransfer(id) {
            const t = ftTransfers[id];
            if (!t) return;
            t.cancelled = true;
            if (t.dc) try { t.dc.close(); } catch(e) {}
            if (t.pc) try { t.pc.close(); } catch(e) {}
            socket.emit('fileCancel', { to: t.peerId, transferId: id });
            const el = document.getElementById('ft-' + id);
            if (el) el.remove();
            ftHidePanel();
            ftDelDB(id);
            delete ftTransfers[id];
        }

        // ===================== SOCKET LISTENERS =====================
        socket.on('fileOffer', ftHandleOffer);

        socket.on('fileAccepted', ({ from, transferId, receivedChunks }) => {
            const t = ftTransfers[transferId];
            if (!t) return;
            ftUpdateUI(transferId, 0, t.fileSize, 0, 'Accepted, connecting...');
            ftSenderConnect(t, receivedChunks);
        });

        socket.on('fileRejected', ({ transferId }) => {
            const t = ftTransfers[transferId];
            if (t) {
                ftUpdateUI(transferId, 0, t.fileSize, 0, 'Rejected');
                setTimeout(() => ftDismiss(transferId), 3000);
            }
        });

        socket.on('fileSignal', ftHandleSignal);

        socket.on('fileCancelled', ({ transferId }) => {
            const t = ftTransfers[transferId];
            if (t) {
                t.cancelled = true;
                if (t.dc) try { t.dc.close(); } catch(e) {}
                if (t.pc) try { t.pc.close(); } catch(e) {}
                ftUpdateUI(transferId, t.bytes, t.fileSize, 0, 'Cancelled by peer');
                setTimeout(() => ftDismiss(transferId), 3000);
            }
        });

        // ===================== ATTACH: DOCUMENT TRIGGER =====================
        // Wire the Document item in the attach dropdown to file transfer
        document.getElementById('docUploadBtn').addEventListener('click', () => {
            if (!selectedUser) { alert('Select a user first'); return; }
            document.getElementById('fileTransferInput').click();
            document.getElementById('attachDropdown').classList.add('hidden');
        });

        // When user picks a file, start the P2P transfer
        document.getElementById('fileTransferInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) ftSend(file);
            e.target.value = '';
        });

        // Toggle file transfers panel visibility
        document.getElementById('ftPanelClose').addEventListener('click', () => {
            document.getElementById('ftPanel').classList.toggle('hidden');
        });
    </script>
</html>
